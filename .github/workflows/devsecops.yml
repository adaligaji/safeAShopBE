name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  security-pipeline:
    name: DevSecOps Security Pipeline
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # PASO 1 - OBTENER EL CÓDIGO
      # ==========================================
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # PASO 2 - SECRET SCANNING
      # ==========================================
      - name: 2. Secret Scanning - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # PASO 3 - SAST
      # ==========================================
      - name: 3. SAST - Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/owasp-top-ten
            p/javascript
            p/nodejs


      # ==========================================
      # PASO 4 - SCA
      # ==========================================
      - name: 4. SCA - Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1


      # ==========================================
      # PASO 5 - SECURITY GATE
      # ==========================================
      - name: 5. Security Gate
        run: |
          echo "======================================"
          echo "   DEVSECOPS SECURITY GATE"
          echo "======================================"
          echo "Gitleaks: PASS"
          echo "Semgrep:  PASS"
          echo "Trivy:    PASS"
          echo "======================================"
          echo "No critical security issues detected."
          echo "Pipeline completed successfully."
