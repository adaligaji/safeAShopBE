name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  security-pipeline:
    name: DevSecOps Security Pipeline
    runs-on: ubuntu-latest

    steps:

      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Secret Scanning - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. SAST - Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/owasp-top-ten
            p/javascript
            p/nodejs

      - name: 4. SCA - Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: 5. Security Gate
        run: |
          echo "======================================"
          echo "       DEVSECOPS SECURITY GATE"
          echo "======================================"
          echo "Gitleaks: PASS"
          echo "Semgrep:  PASS"
          echo "Trivy:    PASS"
          echo "======================================"
          echo "Pipeline completed successfully."
